server:
  port: ${BACKEND_SERVER_PORT:8081}

spring:
  application:
    name: backend-service
  cloud:
    service-registry:
      auto-registration:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  datasource:
    url: ${DB_URL:jdbc:postgresql://59.110.116.141:5432/postgres}
    username: ${DB_USERNAME:leon}
    password: ${DB_PASSWORD:YcjQe%dFF2*Ds3z7mysH4w}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 5s

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: smart-medical-java
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen-plus}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v3}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: http://localhost:9005
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    ct-original: medical-ct-original
    ct-processed: medical-ct-processed
    ct-heatmap: medical-ct-heatmap
    report: medical-report
    knowledge-docs: knowledge-docs

python:
  image-ai:
    base-url: http://localhost:8001

app:
  ai:
    embedding-version: ${OPENAI_EMBEDDING_VERSION:1}
    models:
      agent-model: ${OPENAI_AGENT_MODEL:${OPENAI_MODEL:qwen-plus}}
      analysis-model: ${OPENAI_ANALYSIS_MODEL:qwen-turbo}
  ct-analysis:
    python-executable: /opt/anaconda3/envs/neuedu/bin/python
    script-path: .md/ct/infer_b1_b2.py
    model-path: .md/ct/best_b1_b2_model.pth
    timeout-seconds: 300
    local-cache-dir: datas/ct-analysis-cache
  kafka:
    topic:
      image-analysis-request: medical.image.analysis.request
      image-analysis-result: medical.image.analysis.result
      ai-chat-log: medical.ai.chat.log
      audit-log: medical.audit.log
      notification: medical.notification

auth:
  jwt:
    secret: ${JWT_SECRET:smart-medical-jwt-secret-key-please-change-in-production-123456}
    issuer: smart-medical
    access-expiration-seconds: 7200
    refresh-expiration-seconds: 604800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.neusoft.neu23.neuhospital

knife4j:
  enable: true
  setting:
    language: zh_cn
