server:
  port: ${REGISTRATION_SERVER_PORT:10023}

spring:
  application:
    name: registration-service
  cloud:
    service-registry:
      auto-registration:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

  datasource:
    url: ${DB_URL:jdbc:postgresql://59.110.116.141:5432/postgres}
    username: ${DB_USERNAME:leon}
    password: ${DB_PASSWORD:YcjQe%dFF2*Ds3z7mysH4w}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      data-source-properties:
        ApplicationName: ${spring.application.name}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 5s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${REGISTRATION_KAFKA_GROUP:registration-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.neusoft.neu23.neuhospital

knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  registration:
    # 患者可预约窗口：含当天共 7 个自然日（今天 + 未来 6 天）
    advance-days: 7
    auto-generate-enabled: false
    auto-generate-cron: "0 0 23 * * SUN"
